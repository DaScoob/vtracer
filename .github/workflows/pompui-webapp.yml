name: POMPUI webapp build

on:
  push:
    branches:
      - feature/pompui-ui
      - feature/oklch-color-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build POMPUI VTracer image
        run: docker build --tag pompui-vtracer:ci .
